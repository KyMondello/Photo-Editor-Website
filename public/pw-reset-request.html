<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Anchor Edit</title>
    <link rel="stylesheet" href="../src/UI/styles/global.css">
    <link rel="stylesheet" href="../src/UI/styles/register.css">
    <link rel="icon" type="image/png" href="../src/UI/images/simple-logo.png">
</head>

<body>
    <div class="register-container">
        <div class="logo">
            <img src="../src/UI/images/simple-logo.png" alt="Anchor Edit Logo">
            <span id="home-link"><a href="index.html" class="home-link">Anchor Edit</a></span>
        </div>
        <h2>Reset Password</h2>

        <!-- Identify the account. forgotPassword.js sends this to the backend
             and then redirects to reset-password.html. -->
        <form id="forgotPasswordForm" novalidate>
            <p class="form-hint">Enter the username and email associated with your account.</p>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>

            <p class="form-message error" id="message" role="alert"></p>

            <button class="cta-button" type="submit">Continue</button>
        </form>

        <p>Remembered your password? <a href="login.html">Login here</a></p>
    </div>

    <script src="../src/UI/auth/forgotPassword.js"></script>
</body>
</html>
