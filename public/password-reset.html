<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset - Anchor Edit</title>
    <link rel="stylesheet" href="../src/UI/styles/global.css">
    <link rel="stylesheet" href="../src/UI/styles/login.css">
    <link rel="icon" type="image/png" href="../src/UI/images/simple-logo.png">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="../src/UI/images/simple-logo.png" alt="Anchor Edit Logo">
            <span id="home-link"><a href="index.html" class="home-link">Anchor Edit</a></span>
        </div>
        <h2>Password Reset</h2>
        <form id="password-reset-form">
           

            <label for="new-password">New Password:</label>
            <input type="password" id="new-password" name="new-password" placeholder="Enter your new password" required>

            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your new password" required>

            <button class="cta-button" type="submit">Reset Password</button>
        </form>
        <p>Remembered your password? <a href="login.html">Login here</a></p>
    </div>
</body>
</html>
