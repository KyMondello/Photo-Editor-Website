<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Editor - Edit</title>
  <link rel="stylesheet" href="../src/ui/styles/global.css">
  <link rel="stylesheet" href="../src/ui/styles/editor.css">
  <link rel="icon" type="image/png" href="../src/UI/images/simple-logo.png">
  <script src="https://kit.fontawesome.com/5c85727423.js" crossorigin="anonymous"></script>
</head>
<body>

  <nav class="navbar">
    <div class="logo">
    <span id="home-link"><a href="index.html" class="home-link"><i class="fa-solid fa-anchor"></i>Anchor Edit</i></a></span>
    </div>
    <span id="auth-status"><a href="login.html" class="login-button"><i class="fa-solid fa-user"></i>Login</a></span>
  </nav>

  <main class="editor-layout">

    <aside class="toolbar" id="toolbar">
      <!-- Toolbar buttons get added here, wired to src/tools/ functions -->
      <button id="tool-flip"><i class="fa-solid fa-right-left"></i>Flip</button>
      <button id="tool-crop"><i class="fa-solid fa-crop"></i>Crop</button>
      <button id="tool-rotate"><i class="fa-solid fa-rotate"></i>Rotate</button>
      <button id="tool-resize"><i class="fa-solid fa-expand"></i>Resize</button>
      
      <button id="tool-lasso"><i class="fa-solid fa-hand-pointer"></i>Lasso</button>
      <button id="tool-color"><i class="fa-solid fa-palette"></i>Color</button>
      <button id="tool-filters"><i class="fa-solid fa-sliders"></i>Filters</button>
      <button id="tool-contrast"><i class="fa-solid fa-adjust"></i>Contrast</button>
      <button id="tool-blur"><img src="../src/UI/images/blur.png" alt="Blur/Sharpen">Blur/Sharpen</button>
      <button id="tool-highlighter"><i class="fa-solid fa-highlighter" ></i>Highlighter</button>
    </aside>

    <section class="canvas-area">
      <div id="upload-prompt">
        <p>No image loaded yet</p>
        <label for="image-upload" class="upload-button"><i class="fa-solid fa-upload"></i>Upload Image</label>
        <input type="file" id="image-upload" accept="image/*" hidden>
      </div>

      <canvas id="photo-canvas" width="800" height="600"></canvas>
    </section>

    <aside class="properties-panel" id="properties-panel">
      <!-- Tool-specific controls (e.g. contrast slider) render here -->
      <div class="history-controls">
        <button id="undo-button"><i class="fa-solid fa-arrow-rotate-left"></i>Undo</button>
        <button id="redo-button"><i class="fa-solid fa-arrow-rotate-right"></i>Redo</button>
      </div>

      <div id="tool-controls"></div>


      <div id="save-panel">
        <button id="save-button">Save Locally</button>
      </div>
    </aside>

    
    
      
   
   

  </main>

  <script type="module" src="../src/UI/components/canvas.js"></script>
  <script type = "module" src="../src/UI/tools/rotate.js"></script>
  <script type = "module" src="../src/UI/tools/crop.js"></script>
  <script type = "module" src="../src/UI/tools/resize.js"></script>
  <script type="module" src="../src/UI/components/toolbar.js"></script>
  <script type="module" src="../src/UI/components/save.js"></script>
  <script type="module" src="../src/UI/components/history.js"></script>
  

</body>
</html>
