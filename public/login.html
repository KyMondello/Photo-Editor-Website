<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Anchor Edit</title>
    <link rel="stylesheet" href="../src/UI/styles/global.css">
    <link rel="stylesheet" href="../src/UI/styles/login.css">
    <link rel="icon" type="image/png" href="../src/UI/images/simple-logo.png">

    
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="../src/UI/images/simple-logo.png" alt="Anchor Edit Logo">
            <span id="home-link"><a href="index.html" class="home-link">Anchor Edit</a></span>
        </div>
        <h2>Login</h2>
        
        <form id="login-form">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>
</body>
</html>
